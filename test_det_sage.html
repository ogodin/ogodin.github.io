<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Déterminant d'une matrice 3×3</title>

    <script src="https://sagecell.sagemath.org/static/embedded_sagecell.js"></script>

    <script>
    window.onload = function () {
        sagecell.makeSagecell({
            inputLocation: "#sagecell",
            evalButtonText: "Calculer",
            autoeval: false,
            hide: ["permalink"]
        });
    };
    </script>
</head>

<body>

<h2>Déterminant d'une matrice 3×3</h2>

<p>
Modifiez la matrice au besoin, puis cliquez sur <strong>Calculer</strong>.
</p>

<div id="sagecell">
<script type="text/x-sage">
A = matrix([
    [2, 1, 3],
    [0, 4, 5],
    [7, 2, 6]
])

show(A)
print("det(A) =", A.det())
</script>
</div>

</body>
</html>
